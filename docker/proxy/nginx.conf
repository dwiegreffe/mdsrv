events {}

http {
    upstream mdsrv_remote_session {
        server mdsrv-remote-session:1337;
    }

    upstream mdsrv_yml {
        server mdsrv-yml-server:1340;
    }

    server {
        listen 1337;
        client_max_body_size 20m;

        location = / {
            return 302 /docs/;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /docs {
            return 302 /docs/;
        }

        location /docs/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
        }

        location = /api/v1/openapi.json {
            alias /usr/share/nginx/html/openapi.json;
            default_type application/json;
        }

        location /api/v1/yaml/ {
            proxy_http_version 1.1;
            proxy_pass http://mdsrv_yml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/yaml {
            proxy_http_version 1.1;
            proxy_pass http://mdsrv_yml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass http://mdsrv_remote_session;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
