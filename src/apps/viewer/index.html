<!--
    Overview
    -------
    This page bootstraps the MDsrv/Mol* "Viewer". The visible UI you see in the browser
    (left tree panel, toolbars, controls, and the 3D canvas) is NOT authored here in HTML.
    Instead, the Mol* Plugin UI is created dynamically by the bundled script (molstar.js)
    and mounted into the #app element. The global `molstar` object (provided by molstar.js)
    exposes a high-level Viewer API used below to configure the app and load data.

    What is the "viewer"?
    - The viewer is an instance returned by `molstar.Viewer.create(...)`.
    - It wires up a Mol* Plugin (WebGL renderer + React UI) and provides convenience
        methods to load structures, densities, and complete saved sessions.
    - The rest of the page (panels, controls, canvas) is rendered by this instance
        into the #app container.

    Where does the rest of the UI come from?
    - molstar.css provides all styles for the Mol* UI components.
    - molstar.js initializes the Plugin, builds the UI, and attaches it to #app.
    - The HTML here only provides the host container and configuration via URL params.

    What are the different "load" methods below?
    - viewer.loadPdb(id): fetches atomic structure by PDB ID from the selected provider.
    - viewer.loadPdbDev(id): loads models from the PDB-Dev service.
    - viewer.loadEmdb(id): fetches EM density map by EMDB ID and displays it (optionally
        with fitted structure when available).
    - viewer.loadAlphaFoldDb(id): downloads an AlphaFold DB model with presets (e.g., pLDDT coloring).
    - viewer.loadModelArchive(id): loads models from ModelArchive by ID.
    - viewer.loadStructureFromUrl(url, format, isBinary): loads data directly from any URL you control.
    - viewer.loadSessionFromUrl(url): restores a full saved session (data + visual state), not just raw data.
    - viewer.setRemoteSnapshot(snapshotId): restores a snapshot from a remote state server by its ID.
-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Basic document meta and mobile viewport settings -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <!-- <link rel="icon" href="./favicon.ico" type="image/x-icon"> -->
        <title>MDsrv</title>
    <!-- Minimal page styles for sizing/positioning the host container (#app). The Mol* UI itself is rendered dynamically. -->
        <style>
            /* Reset margins/padding and use border-box sizing for consistent layout */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            /* Make the page fill the window and prevent scrollbars */
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            /* Small convenience spacing for potential separators */
            hr {
                margin: 10px;
            }
            /* Headline margins kept minimal for compact UI */
            h1, h2, h3, h4, h5 {
                margin-top: 5px;
                margin-bottom: 3px;
            }
            /* Keep buttons compact */
            button {
                padding: 2px;
            }
            /* Host element for the Mol* viewer; resized/positioned via CSS */
            #app {
                position: absolute;
                left: 100px;
                top: 100px;
                width: 800px;
                height: 600px;
            }
        </style>
    <!-- Mol* viewer stylesheet (all component/layout styles for the dynamic UI). Generated by the build. -->
        <link rel="stylesheet" type="text/css" href="molstar.css" />
    </head>
    <body>
    <!-- Viewer mount point: the Mol* Plugin UI and the WebGL canvas are injected here at runtime by molstar.js. -->
        <div id="app"></div>
        
        <!-- Viewer bundle script that exposes the global `molstar` API (build output). It creates and renders the entire UI. -->
        <script type="text/javascript" src="./molstar.js"></script>
        <script type="text/javascript">
            // getParam(name, regex)
            // Reads a value from the URL query string using a regex for the value.
            // Example: ?pdb=1cbs  =>  getParam('pdb', '[^&]+') === '1cbs'. Returns '' if missing.
            function getParam(name, regex) {
                var r = new RegExp(name + '=' + '(' + regex + ')[&]?', 'i');
                return decodeURIComponent(((window.location.search || '').match(r) || [])[1] || '');
            }

            // Debug mode: enables verbose logging and developer helpers inside the Mol* Plugin.
            // Toggle by appending ?debug-mode=1 to the URL.
            var debugMode = getParam('debug-mode', '[^&]+').trim() === '1';
            if (debugMode) molstar.setDebugMode(debugMode, debugMode);

            // UI layout flags controlled via URL parameters:
            // - hide-controls=1           => render only the 3D canvas (no side/top panels)
            // - collapse-left-panel=1     => start with the data tree panel collapsed
            var hideControls = getParam('hide-controls', '[^&]+').trim() === '1';
            var collapseLeftPanel = getParam('collapse-left-panel', '[^&]+').trim() === '1';
            
            // Data providers (choose services used by the convenience loaders). Defaults fall back to PDBe.
            // Common values: 'pdbe', 'rcsb'.
            var pdbProvider = getParam('pdb-provider', '[^&]+').trim().toLowerCase();
            var emdbProvider = getParam('emdb-provider', '[^&]+').trim().toLowerCase();
            var mapProvider = getParam('map-provider', '[^&]+').trim().toLowerCase();
            
            // Rendering quality/performance knobs (optional, all via URL):
            // - pixel-scale: >1 => higher quality, slower; <1 => faster, blurrier.
            // - pick-scale: offscreen picking buffer resolution scale (lower is faster but less precise).
            // - pick-padding: extra pixels around pick targets to make selection easier.
            // - disable-wboit=1: turn off weighted blended order independent transparency.
            // - prefer-webgl1=1: force WebGL1 for compatibility (at the cost of features/perf).
            var pixelScale = getParam('pixel-scale', '[^&]+').trim();
            var pickScale = getParam('pick-scale', '[^&]+').trim();
            var pickPadding = getParam('pick-padding', '[^&]+').trim();
            var disableWboit = getParam('disable-wboit', '[^&]+').trim() === '1';
            var preferWebgl1 = getParam('prefer-webgl1', '[^&]+').trim() === '1' || void 0;

            // Create and configure the viewer instance, mounting it into the #app element.
            // Options here control initial UI layout, data providers, and renderer behavior.
            molstar.Viewer.create('app', {
                // UI layout configuration
                layoutShowControls: !hideControls,
                viewportShowExpand: false,
                collapseLeftPanel: collapseLeftPanel,
                
                // Data/provider configuration
                // Affects how helper methods like loadPdb/loadEmdb resolve IDs.
                pdbProvider: pdbProvider || 'pdbe',
                emdbProvider: emdbProvider || 'pdbe',
                // Choose default volume server based on selected map provider
                volumeStreamingServer: (mapProvider || 'pdbe') === 'rcsb'
                    ? 'https://maps.rcsb.org'
                    : 'https://www.ebi.ac.uk/pdbe/densities',
                
                // Rendering quality/performance
                pixelScale: parseFloat(pixelScale) || 1,          // >1 = higher visual quality, slower
                pickScale: parseFloat(pickScale) || 0.25,         // picking buffer resolution scale
                pickPadding: isNaN(parseFloat(pickPadding)) ? 1 : parseFloat(pickPadding), // padding around pick targets
                
                // Renderer features
                enableWboit: disableWboit ? false : void 0, // use default value if disable-wboit is not set
                preferWebgl1: preferWebgl1,
            }).then(viewer => {
                // The `viewer` exposes high-level loaders that fetch data and apply reasonable presets.

                // Optionally load a remote snapshot by ID (server-controlled).
                // Restores a saved visual state and data from a snapshot store.
                var snapshotId = getParam('snapshot-id', '[^&]+').trim();
                if (snapshotId) viewer.setRemoteSnapshot(snapshotId);

                // Optionally load a snapshot from a URL (molj/json/msgpack).
                // Useful for sharing a view with exact representations, camera, colors, etc.
                var snapshotUrl = getParam('snapshot-url', '[^&]+').trim();
                var snapshotUrlType = getParam('snapshot-url-type', '[^&]+').toLowerCase().trim() || 'molj';
                if (snapshotUrl && snapshotUrlType) viewer.loadSnapshotFromUrl(snapshotUrl, snapshotUrlType);

                // Load a structure directly from a URL (format and binary flag configurable).
                // Good for loading files you host yourself (e.g., .cif, .bcif, .pdb, .mmtf).
                var structureUrl = getParam('structure-url', '[^&]+').trim();
                var structureUrlFormat = getParam('structure-url-format', '[a-z]+').toLowerCase().trim();
                var structureUrlIsBinary = getParam('structure-url-is-binary', '[^&]+').trim() === '1';
                if (structureUrl) viewer.loadStructureFromUrl(structureUrl, structureUrlFormat, structureUrlIsBinary);

                // Convenience loaders for common sources:
                var pdb = getParam('pdb', '[^&]+').trim();
                if (pdb) viewer.loadPdb(pdb); // PDB ID (e.g., 1cbs)

                var pdbDev = getParam('pdb-dev', '[^&]+').trim();
                if (pdbDev) viewer.loadPdbDev(pdbDev); // PDB-Dev entry ID

                var emdb = getParam('emdb', '[^&]+').trim();
                if (emdb) viewer.loadEmdb(emdb); // EMDB ID (e.g., EMD-XXXX)

                var afdb = getParam('afdb', '[^&]+').trim();
                if (afdb) viewer.loadAlphaFoldDb(afdb); // AlphaFold DB accession (e.g., AF-Qxxxx)

                var modelArchive = getParam('model-archive', '[^&]+').trim();
                if (modelArchive) viewer.loadModelArchive(modelArchive); // ModelArchive ID

                // Load a full session from URL (restores state including representations, camera, coloring, etc.).
                var sessionUrl = getParam('session-url', '[^&]+').trim();
                if (sessionUrl) viewer.loadSessionFromUrl(sessionUrl);
            });
        </script>
        <!--
          Analytics placeholder
          ---------------------
          The token "__MOLSTAR_ANALYTICS__" is replaced during deployment (see scripts/deploy.js)
          with an appropriate analytics snippet. It is intentionally empty in development builds.
        -->
        <!-- __MOLSTAR_ANALYTICS__ placeholder is replaced during deployment (see scripts/deploy.js) -->
    </body>
</html>
